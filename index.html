<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classroom Lyric Reader</title>
  <style>
    body {
      font-family: 'Arial Black', Impact, sans-serif;
      background-color: #121212;
      margin: 0;
      padding: 40px 32vw 40px 40px;
      box-sizing: border-box;
      user-select: none;
      min-height: 100vh;
    }

    /* Main Lyric Layout */
    #lyrics-container {
      text-align: left;
      line-height: 1.8;
      font-size: 3.2rem;
      letter-spacing: 1px;
    }

    .line {
      margin-bottom: 25px;
      display: block;
    }

    .word {
      display: inline-block;
      white-space: nowrap;
      margin-right: 18px; 
    }

    /* Voice Types & Dimmed Read-Ahead Colors */
    .line.head-voice .syllable {
      color: #72a2bd; /* Muted pale blue */
    }

    .line.chest-voice .syllable {
      color: #c48282; /* Muted pale red */
    }

    .syllable {
      padding: 2px 0;
      border-radius: 4px;
      transition: all 0.1s ease;
    }

    /* Active Syllable Highlight */
    .syllable.active {
      color: #000000 !important;
      background-color: #FFD700;
      box-shadow: 0 0 12px #FFD700;
      padding: 2px 4px;
    }

    /* Sung Syllables */
    .line.head-voice .syllable.passed {
      color: #A0C8F0; /* Pale Blue */
    }

    .line.chest-voice .syllable.passed {
      color: #FFA0A0; /* Pale Red */
    }

    /* Persistent Fixed Sidebar */
    #sidebar {
      position: fixed;
      right: 40px;
      top: 40px;
      width: 22vw;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 100;
    }

    .info-card {
      background-color: #1a1a1a;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      border: 3px solid;
    }

    .info-card.heavy {
      border-color: #FFA0A0;
      color: #FFA0A0;
    }

    .info-card.light {
      border-color: #A0C8F0;
      color: #A0C8F0;
    }

    .emoji-container {
      font-size: 2.2rem;
      margin-bottom: 4px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .card-title {
      font-size: 1.8rem;
      letter-spacing: 2px;
      margin: 0;
    }

    /* Nav Section Container */
    .nav-section {
      background-color: #1a1a1a;
      border-radius: 16px;
      padding: 14px;
      border: 2px solid #333333;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-title {
      color: #888888;
      font-family: sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 2px 0;
      text-align: center;
    }

    .nav-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      background-color: #2a2a2a;
      color: #ffffff;
      border: 2px solid #444444;
      border-radius: 10px;
      padding: 10px;
      font-family: 'Arial Black', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .btn:hover {
      background-color: #FFD700;
      color: #000000;
      border-color: #FFD700;
    }

    .btn.active-song {
      background-color: #FFD700;
      color: #000000;
      border-color: #FFD700;
    }

    #controls {
      position: fixed;
      bottom: 15px;
      left: 40px;
      font-family: sans-serif;
      font-size: 0.9rem;
      color: #666666;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div id="lyrics-container"></div>

  <div id="sidebar">
    <div class="info-card heavy">
      <div class="emoji-container">🏋️ 🍞</div>
      <h2 class="card-title">HEAVY</h2>
    </div>

    <div class="info-card light">
      <div class="emoji-container">☁️ 🪶</div>
      <h2 class="card-title">LIGHT</h2>
    </div>

    <div class="nav-section">
      <div class="nav-title">Jump to Phrase</div>
      <div id="phrase-buttons" class="nav-grid"></div>
    </div>

    <div class="nav-section">
      <div class="nav-title">Select Song</div>
      <div class="nav-grid-2">
        <button id="song-btn-navy" class="btn active-song" onclick="switchSong('navy', event)">Navy</button>
        <button id="song-btn-coastGuard" class="btn" onclick="switchSong('coastGuard', event)">Coast Guard</button>
      </div>
    </div>
  </div>

  <div id="controls">Click anywhere or use spacebar/arrow keys to advance</div>

  <script>
    const songs = {
      navy: {
        data: [
          { text: "An-chors a-weigh, my boys", voice: "chest" },
          { text: "An-chors a-weigh!", voice: "head" },
          { text: "Fare-well to col-lege joys", voice: "head" },
          { text: "We sail at break of day,", voice: "head" },
          { text: "Day, day, day.", voice: "chest" },
          { text: "Through our last night on shore", voice: "chest" },
          { text: "Hail to the foam", voice: "head" },
          { text: "Un-til we meet once more", voice: "head" },
          { text: "Here’s wish-ing you a hap-py voy-age home", voice: "head" }
        ],
        phrases: [
          { label: 'Phrase 1 ("An-chors")', word: 'An' },
          { label: 'Phrase 2 ("Fare-well")', word: 'Fare' },
          { label: 'Phrase 3 ("Through")', word: 'Through' },
          { label: 'Phrase 4 ("Un-til")', word: 'Un' }
        ]
      },
      coastGuard: {
        data: [
          { text: "We’re al-ways read-y for the call!", voice: "chest" },
          { text: "We place our trust in thee!", voice: "head" },
          { text: "Through surf and storm and how-ling gale", voice: "head" },
          { text: "High shall our pur-pose be!", voice: "head" },
          { text: "“Sem-per Par-a-tus” is our guide", voice: "chest" },
          { text: "Our fame, our glo-ry, too", voice: "head" },
          { text: "To fight to save or fight and die.", voice: "head" },
          { text: "Aye! Coast Guard, we are for you.", voice: "head" }
        ],
        phrases: [
          { label: 'Phrase 1 ("We’re")', word: 'We’re' },
          { label: 'Phrase 2 ("Through")', word: 'Through' },
          { label: 'Phrase 3 ("“Sem-per")', word: '“Sem' },
          { label: 'Phrase 4 ("To fight")', word: 'To' }
        ]
      }
    };

    let currentSongKey = 'navy';
    let syllables = [];
    let currentIndex = -1;
    const container = document.getElementById('lyrics-container');
    const phraseContainer = document.getElementById('phrase-buttons');

    function loadSong(songKey) {
      currentSongKey = songKey;
      container.innerHTML = '';
      phraseContainer.innerHTML = '';
      syllables = [];
      currentIndex = -1;

      const song = songs[songKey];

      // Build Lyrics DOM
      song.data.forEach(lineObj => {
        const lineDiv = document.createElement('div');
        lineDiv.className = `line ${lineObj.voice}-voice`;
        
        const words = lineObj.text.split(' ');
        words.forEach((wordText) => {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';

          const syls = wordText.split('-');
          syls.forEach((sylText) => {
            const sylSpan = document.createElement('span');
            sylSpan.className = 'syllable';
            sylSpan.textContent = sylText;
            
            wordSpan.appendChild(sylSpan);
            syllables.push(sylSpan);
          });

          lineDiv.appendChild(wordSpan);
        });

        container.appendChild(lineDiv);
      });

      // Build Phrase Jump Buttons
      song.phrases.forEach(phrase => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.textContent = phrase.label;
        btn.onclick = (e) => jumpToWord(phrase.word, e);
        phraseContainer.appendChild(btn);
      });

      // Update Song Selector Button States
      document.getElementById('song-btn-navy').classList.toggle('active-song', songKey === 'navy');
      document.getElementById('song-btn-coastGuard').classList.toggle('active-song', songKey === 'coastGuard');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchSong(songKey, event) {
      if (event) event.stopPropagation();
      loadSong(songKey);
    }

    function jumpToSyllable(targetIndex, event) {
      if (event) event.stopPropagation();
      if (targetIndex < 0 || targetIndex >= syllables.length) return;

      syllables.forEach((syl, i) => {
        syl.classList.remove('active', 'passed');
        if (i < targetIndex) {
          syl.classList.add('passed');
        } else if (i === targetIndex) {
          syl.classList.add('active');
        }
      });

      currentIndex = targetIndex;
      syllables[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function jumpToWord(targetText, event) {
      const index = syllables.findIndex(syl => syl.textContent.trim() === targetText);
      if (index !== -1) {
        jumpToSyllable(index, event);
      }
    }

    function advance() {
      if (currentIndex < syllables.length - 1) {
        if (currentIndex >= 0) {
          syllables[currentIndex].classList.remove('active');
          syllables[currentIndex].classList.add('passed');
        }
        currentIndex++;
        syllables[currentIndex].classList.add('active');
        syllables[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function stepBack() {
      if (currentIndex >= 0) {
        syllables[currentIndex].classList.remove('active');
        currentIndex--;
        if (currentIndex >= 0) {
          syllables[currentIndex].classList.remove('passed');
          syllables[currentIndex].classList.add('active');
          syllables[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowRight', 'PageDown', 'ArrowDown'].includes(e.code)) {
        e.preventDefault();
        advance();
      } else if (['ArrowLeft', 'PageUp', 'ArrowUp'].includes(e.code)) {
        e.preventDefault();
        stepBack();
      }
    });

    window.addEventListener('click', advance);

    // Initial Load
    loadSong('navy');
  </script>
</body>
</html>
