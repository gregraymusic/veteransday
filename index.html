<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Lyric Reader</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1a1a1a;
      --card-border: #333333;
      --gold-highlight: #FFD700;
      --chest-muted: #c48282;
      --chest-passed: #FFA0A0;
      --head-muted: #72a2bd;
      --head-passed: #A0C8F0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial Black', Impact, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 0;
      color: #ffffff;
      user-select: none;
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    #app-layout {
      display: flex;
      width: 100vw;
      min-height: 100vh;
    }

    /* Main Lyric Display Area */
    #main-content {
      flex: 1 1 auto;
      padding: 40px 40px 80px 40px;
      overflow-y: auto;
    }

    #lyrics-container {
      text-align: left;
      line-height: 1.8;
      font-size: clamp(2rem, 4vw, 3.6rem);
      letter-spacing: 1px;
    }

    .line {
      margin-bottom: 22px;
      display: block;
    }

    .word {
      display: inline-block;
      white-space: nowrap;
      margin-right: 16px; 
    }

    /* Voice Types & Dimmed Read-Ahead Colors */
    .line.head-voice .syllable {
      color: var(--head-muted);
    }

    .line.chest-voice .syllable {
      color: var(--chest-muted);
    }

    .syllable {
      padding: 2px 0;
      border-radius: 4px;
      transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    /* Active Syllable Highlight */
    .syllable.active {
      color: #000000 !important;
      background-color: var(--gold-highlight);
      box-shadow: 0 0 16px var(--gold-highlight);
      padding: 2px 6px;
    }

    /* Sung Syllables */
    .line.head-voice .syllable.passed {
      color: var(--head-passed);
    }

    .line.chest-voice .syllable.passed {
      color: var(--chest-passed);
    }

    /* Responsive Fixed Sidebar */
    #sidebar {
      width: clamp(260px, 26vw, 380px);
      flex: 0 0 auto;
      height: 100vh;
      position: sticky;
      top: 0;
      padding: 16px;
      background-color: rgba(18, 18, 18, 0.98);
      border-left: 2px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      z-index: 100;
    }

    /* Scrollbar styling for compact sidebar */
    #sidebar::-webkit-scrollbar {
      width: 6px;
    }
    #sidebar::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    .info-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: clamp(8px, 1.2vh, 14px);
      text-align: center;
      border: 3px solid;
      flex: 0 1 auto;
    }

    .info-card.heavy {
      border-color: var(--chest-passed);
      color: var(--chest-passed);
    }

    .info-card.light {
      border-color: var(--head-passed);
      color: var(--head-passed);
    }

    .emoji-container {
      font-size: clamp(1.2rem, 1.8vh, 1.8rem);
      margin-bottom: 2px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .card-title {
      font-size: clamp(1.1rem, 1.6vh, 1.5rem);
      letter-spacing: 2px;
      margin: 0;
    }

    /* Section Containers */
    .nav-section {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: clamp(10px, 1.2vh, 14px);
      border: 2px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 0 1 auto;
    }

    .nav-title {
      color: #888888;
      font-family: sans-serif;
      font-size: clamp(0.7rem, 0.9vh, 0.8rem);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 2px 0;
      text-align: center;
    }

    /* 2-Column Compact Phrase Grid */
    .phrase-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn {
      background-color: #2a2a2a;
      color: #ffffff;
      border: 2px solid #444444;
      border-radius: 8px;
      padding: clamp(6px, 1vh, 9px) 4px;
      font-family: 'Arial Black', sans-serif;
      font-size: clamp(0.75rem, 1.1vh, 0.9rem);
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .btn:hover {
      background-color: var(--gold-highlight);
      color: #000000;
      border-color: var(--gold-highlight);
    }

    /* Stylish Song Dropdown */
    .song-select {
      width: 100%;
      background-color: #2a2a2a;
      color: #ffffff;
      border: 2px solid var(--gold-highlight);
      border-radius: 8px;
      padding: clamp(8px, 1.2vh, 10px) 12px;
      font-family: 'Arial Black', sans-serif;
      font-size: clamp(0.85rem, 1.3vh, 1.05rem);
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
    }

    .song-select:focus, .song-select:hover {
      background-color: #333333;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
    }

    .song-select option {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: sans-serif;
      font-size: 1rem;
      padding: 8px;
    }

    #controls {
      position: fixed;
      bottom: 12px;
      left: 30px;
      font-family: sans-serif;
      font-size: 0.85rem;
      color: #888888;
      background: rgba(18, 18, 18, 0.8);
      padding: 4px 10px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 90;
    }

    @media (max-width: 768px) {
      #app-layout {
        flex-direction: column;
      }
      #main-content {
        padding: 20px 20px 40px 20px;
      }
      #sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-left: none;
        border-top: 2px solid var(--card-border);
      }
      #controls {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div id="app-layout">
    <main id="main-content">
      <div id="lyrics-container"></div>
    </main>

    <aside id="sidebar">
      <div class="info-card heavy">
        <div class="emoji-container">🏋️ 🍞</div>
        <h2 class="card-title">HEAVY</h2>
      </div>

      <div class="info-card light">
        <div class="emoji-container">☁️ 🪶</div>
        <h2 class="card-title">LIGHT</h2>
      </div>

      <!-- Phrase Navigation Section -->
      <div class="nav-section">
        <div class="nav-title">Jump to Line</div>
        <div id="phrase-buttons" class="phrase-grid"></div>
      </div>

      <!-- Song Selector Dropdown -->
      <div class="nav-section">
        <div class="nav-title">Select Song</div>
        <select id="song-dropdown" class="song-select" onchange="switchSong(this.value, event)">
          <option value="navy">Navy</option>
          <option value="coastGuard">Coast Guard</option>
          <option value="airForce">U.S. Air Force</option>
        </select>
      </div>
    </aside>
  </div>

  <div id="controls">Click anywhere or use Spacebar / Arrow Keys to advance</div>

  <script>
    const songs = {
      navy: {
        title: "Navy",
        data: [
          { text: "An-chors a-weigh, my boys", voice: "chest" },
          { text: "An-chors a-weigh!", voice: "head" },
          { text: "Fare-well to col-lege joys", voice: "head" },
          { text: "We sail at break of day,", voice: "head" },
          { text: "Day, day, day.", voice: "chest" },
          { text: "Through our last night on shore", voice: "chest" },
          { text: "Hail to the foam", voice: "head" },
          { text: "Un-til we meet once more", voice: "head" },
          { text: "Here’s wish-ing you a hap-py voy-age home", voice: "head" }
        ]
      },
      coastGuard: {
        title: "Coast Guard",
        data: [
          { text: "We’re al-ways read-y for the call!", voice: "chest" },
          { text: "We place our trust in thee!", voice: "head" },
          { text: "Through surf and storm and how-ling gale", voice: "head" },
          { text: "High shall our pur-pose be!", voice: "head" },
          { text: "“Sem-per Par-a-tus” is our guide", voice: "chest" },
          { text: "Our fame, our glo-ry, too", voice: "head" },
          { text: "To fight to save or fight and die.", voice: "head" },
          { text: "Aye! Coast Guard, we are for you.", voice: "head" }
        ]
      },
      airForce: {
        title: "U.S. Air Force",
        data: [
          { text: "Off we go in-to the wild blue yon-der", voice: "chest" },
          { text: "Fly-ing high in-to the sun", voice: "head" },
          { text: "Here they come zoom-ing to meet our thun-der", voice: "chest" },
          { text: "At ‘em boys, give ‘er the gun!", voice: "head" },
          { text: "Down we dive spout-ing our flame from un-der", voice: "chest" },
          { text: "Off with one ter-ri-ble roar", voice: "head" },
          { text: "We live in fame or go down in flame", voice: "head" },
          { text: "Noth-ing can stop the U.-S. Air Force", voice: "head" }
        ]
      }
    };

    let currentSongKey = 'navy';
    let syllables = [];
    let lineStartIndexMap = [];
    let currentIndex = -1;

    const container = document.getElementById('lyrics-container');
    const phraseContainer = document.getElementById('phrase-buttons');

    function loadSong(songKey) {
      currentSongKey = songKey;
      container.innerHTML = '';
      phraseContainer.innerHTML = '';
      syllables = [];
      lineStartIndexMap = [];
      currentIndex = -1;

      const song = songs[songKey];

      // Build Lyrics DOM and track line start syllable indices
      song.data.forEach((lineObj, lineIndex) => {
        const lineDiv = document.createElement('div');
        lineDiv.className = `line ${lineObj.voice}-voice`;
        
        lineStartIndexMap.push(syllables.length);

        const words = lineObj.text.split(' ');
        words.forEach((wordText) => {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';

          const syls = wordText.split('-');
          syls.forEach((sylText) => {
            const sylSpan = document.createElement('span');
            sylSpan.className = 'syllable';
            sylSpan.textContent = sylText;
            
            wordSpan.appendChild(sylSpan);
            syllables.push(sylSpan);
          });

          lineDiv.appendChild(wordSpan);
        });

        container.appendChild(lineDiv);
      });

      // Build Phrase/Line Jump Buttons for EVERY line
      song.data.forEach((lineObj, lineIndex) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        
        // Extract first word for a descriptive button title
        const firstWord = lineObj.text.split(' ')[0].replace('-', '');
        btn.textContent = `L${lineIndex + 1}: ${firstWord}`;
        btn.title = `Jump to Line ${lineIndex + 1}`;
        
        btn.onclick = (e) => jumpToSyllable(lineStartIndexMap[lineIndex], e);
        phraseContainer.appendChild(btn);
      });

      // Ensure dropdown reflects active selection
      document.getElementById('song-dropdown').value = songKey;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchSong(songKey, event) {
      if (event) event.stopPropagation();
      loadSong(songKey);
    }

    function jumpToSyllable(targetIndex, event) {
      if (event) event.stopPropagation();
      if (targetIndex < 0 || targetIndex >= syllables.length) return;

      syllables.forEach((syl, i) => {
        syl.classList.remove('active', 'passed');
        if (i < targetIndex) {
          syl.classList.add('passed');
        } else if (i === targetIndex) {
          syl.classList.add('active');
        }
      });

      currentIndex = targetIndex;
      syllables[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function advance() {
      if (currentIndex < syllables.length - 1) {
        if (currentIndex >= 0) {
          syllables[currentIndex].classList.remove('active');
          syllables[currentIndex].classList.add('passed');
        }
        currentIndex++;
        syllables[currentIndex].classList.add('active');
        syllables[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function stepBack() {
      if (currentIndex >= 0) {
        syllables[currentIndex].classList.remove('active');
        currentIndex--;
        if (currentIndex >= 0) {
          syllables[currentIndex].classList.remove('passed');
          syllables[currentIndex].classList.add('active');
          syllables[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    }

    // Key Listener
    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowRight', 'PageDown', 'ArrowDown'].includes(e.code)) {
        e.preventDefault();
        advance();
      } else if (['ArrowLeft', 'PageUp', 'ArrowUp'].includes(e.code)) {
        e.preventDefault();
        stepBack();
      }
    });

    // Global Click Listener
    window.addEventListener('click', (e) => {
      if (!e.target.closest('button') && !e.target.closest('select') && !e.target.closest('#sidebar')) {
        advance();
      }
    });

    // Initial App Load
    loadSong('navy');
  </script>
</body>
</html>
