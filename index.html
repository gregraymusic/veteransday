<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classroom Lyric Reader</title>
  <style>
    body {
      font-family: 'Arial Black', Impact, sans-serif;
      background-color: #121212;
      color: #333333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      user-select: none;
    }

    #lyrics-container {
      text-align: center;
      max-width: 90vw;
      line-height: 1.8;
      font-size: 3.5rem;
      letter-spacing: 1px;
    }

    .line {
      margin-bottom: 25px;
      display: block;
    }

    /* Keeps syllables touching naturally within a word */
    .word {
      display: inline-block;
      white-space: nowrap;
      margin: 0 12px; 
    }

    /* Brighter default state (~60% opacity) for easier read-ahead */
    .syllable {
      color: #999999; 
      padding: 2px 0;
      border-radius: 4px;
      transition: all 0.1s ease;
    }

    /* Active syllable: Bright yellow highlight with dark text */
    .syllable.active {
      color: #000000;
      background-color: #FFD700;
      box-shadow: 0 0 12px #FFD700;
      padding: 2px 4px;
    }

    /* Sung syllables remain crisp white */
    .syllable.passed {
      color: #FFFFFF;
    }

    #controls {
      position: fixed;
      bottom: 20px;
      font-family: sans-serif;
      font-size: 1rem;
      color: #777777;
    }
  </style>
</head>
<body>

  <div id="lyrics-container"></div>
  <div id="controls">Click anywhere or use spacebar/arrow keys to advance</div>

  <script>
    const rawLyrics = [
      "An-chors a-weigh, my boys",
      "An-chors a-weigh!",
      "Fare-well to col-lege joys",
      "We sail at break of day,",
      "Day, day, day.",
      "Through our last night on shore",
      "Hail to the foam",
      "Un-til we meet once more",
      "Here’s wish-ing you a hap-py voy-age home"
    ];

    const container = document.getElementById('lyrics-container');
    let syllables = [];
    let currentIndex = -1;

    rawLyrics.forEach(lineText => {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      
      const words = lineText.split(' ');
      words.forEach((wordText) => {
        const wordSpan = document.createElement('span');
        wordSpan.className = 'word';

        const syls = wordText.split('-');
        syls.forEach((sylText) => {
          const sylSpan = document.createElement('span');
          sylSpan.className = 'syllable';
          sylSpan.textContent = sylText;
          
          wordSpan.appendChild(sylSpan);
          syllables.push(sylSpan);
        });

        lineDiv.appendChild(wordSpan);
      });

      container.appendChild(lineDiv);
    });

    function advance() {
      if (currentIndex < syllables.length - 1) {
        if (currentIndex >= 0) {
          syllables[currentIndex].classList.remove('active');
          syllables[currentIndex].classList.add('passed');
        }
        currentIndex++;
        syllables[currentIndex].classList.add('active');
        
        syllables[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function stepBack() {
      if (currentIndex >= 0) {
        syllables[currentIndex].classList.remove('active');
        currentIndex--;
        if (currentIndex >= 0) {
          syllables[currentIndex].classList.remove('passed');
          syllables[currentIndex].classList.add('active');
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowRight', 'PageDown', 'ArrowDown'].includes(e.code)) {
        e.preventDefault();
        advance();
      } else if (['ArrowLeft', 'PageUp', 'ArrowUp'].includes(e.code)) {
        e.preventDefault();
        stepBack();
      }
    });

    window.addEventListener('click', advance);
  </script>
</body>
</html>
